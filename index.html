<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: iOS 세이프에어리어(env(safe-area-inset-*)) 활성화에 필수 -->
  <!-- maximum-scale=1, user-scalable=no: 더블탭·핀치 줌 차단 (게임 특성상 의도된 설정, touch-action과 이중 방어) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Dodge — 몇 초나 버틸 수 있나요?</title>
  <meta name="description" content="사방에서 쏟아지는 장애물을 피해 최대한 오래 버티세요. 당신의 기록은 몇 초? 설치 없이 브라우저에서 바로 플레이.">
  <link rel="canonical" href="https://dodge.kionkim.com/">
  <meta name="theme-color" content="#23232b">

  <!-- 카카오톡·페이스북 등 링크 공유 시 표시되는 미리보기 카드 (Open Graph) -->
  <!-- og:image는 절대 URL이어야 하며, 카카오톡은 스크랩 결과를 캐시하므로 -->
  <!-- 내용 변경 후에는 https://developers.kakao.com/tool/clear/og 에서 캐시를 초기화해야 반영된다 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dodge">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://dodge.kionkim.com/">
  <meta property="og:title" content="Dodge — 몇 초나 버틸 수 있나요?">
  <meta property="og:description" content="사방에서 쏟아지는 장애물을 피해 최대한 오래 버티세요. 당신의 기록은 몇 초? 설치 없이 브라우저에서 바로 플레이.">
  <meta property="og:image" content="https://dodge.kionkim.com/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="쏟아지는 장애물 사이를 피해 다니는 Dodge 게임 화면">

  <!-- 트위터/X 큰 이미지 카드 (og 값을 그대로 재사용) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dodge — 몇 초나 버틸 수 있나요?">
  <meta name="twitter:description" content="사방에서 쏟아지는 장애물을 피해 최대한 오래 버티세요. 당신의 기록은 몇 초? 설치 없이 브라우저에서 바로 플레이.">
  <meta name="twitter:image" content="https://dodge.kionkim.com/og-image.png">

  <!-- 구글 애드센스 로더 (게시자: kionkim.com 계정) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1254679092099075"
    crossorigin="anonymous"></script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 게임 전체 컨테이너: 캔버스(게임 필드)와 DOM 오버레이(화면 전환 UI)를 함께 담는다 -->
  <div class="game" id="game">
    <!-- 게임 필드: 논리 좌표계 720×1280을 스케일해 그리는 캔버스 -->
    <canvas class="game__canvas" id="game-canvas"></canvas>

    <!-- 캐릭터 선택 화면 (초기 화면) — 하단 배너 있음 (PRD 5장) -->
    <div class="game__overlay game__overlay--select" id="screen-select" hidden>
      <div class="select">
        <h1 class="select__title">캐릭터 선택</h1>
        <!-- 이전 최고 기록 (기록이 있을 때만 표시 — 재도전 동기 부여) -->
        <p class="select__best" id="select-best" hidden>
          최고 기록 <span class="select__best-value" id="select-best-value">0.00</span>초
        </p>
        <!-- 캐릭터 6종 그리드 (2열×3행) — 슬롯은 ui.js가 생성 -->
        <ul class="select__grid" id="select-grid"></ul>
      </div>
      <!-- 광고 미로드 시에도 레이아웃이 무너지지 않는 고정 높이 컨테이너 -->
      <!-- ADSENSE_SLOT_HOME (dodge-home) — ins는 ads.js가 로드 시점에 동적 생성 -->
      <div class="banner" id="banner-home"></div>
    </div>

    <!-- GAME START 대기 화면 — 광고 없음 (PRD 3.2) -->
    <div class="game__overlay game__overlay--ready" id="screen-ready" hidden>
      <div class="ready">
        <p class="ready__title">GAME START</p>
        <p class="ready__hint">화면을 눌러 시작</p>
      </div>
    </div>

    <!-- 게임오버 오버레이 — dimmed + 기록 + 버튼 + 하단 배너 (PRD 3.4) -->
    <div class="game__overlay game__overlay--gameover" id="screen-gameover" hidden>
      <div class="gameover">
        <p class="gameover__current">이번 기록: <span id="gameover-current">0.00</span>초</p>
        <p class="gameover__best">
          최고 기록: <span id="gameover-best">0.00</span>초
          <span class="gameover__new-record" id="gameover-new-record" hidden>신기록!</span>
        </p>
        <!-- 0.8초 입력 잠금 동안 페이드인으로 서서히 나타나는 버튼 영역 (PRD 3.4) -->
        <div class="gameover__actions gameover__actions--locked" id="gameover-actions">
          <button class="gameover__restart" id="gameover-restart" type="button" disabled>RESTART</button>
          <!-- 기록 공유: 모바일은 공유 시트, 미지원 환경은 클립보드 복사로 대체 (share.js) -->
          <button class="gameover__share" id="gameover-share" type="button" disabled>기록 공유</button>
          <button class="gameover__home" id="gameover-home" type="button" disabled>초기화면으로</button>
        </div>
      </div>
      <!-- 배너는 dimmed 레이어 위에 렌더 (PRD 3.4) -->
      <!-- ADSENSE_SLOT_GAMEOVER (dodge-gameover) — 오버레이 첫 표시 때 ads.js가 ins 동적 생성 -->
      <div class="banner" id="banner-gameover"></div>
    </div>

    <!-- 일시정지 오버레이 (PRD 4.6) -->
    <div class="game__overlay game__overlay--paused" id="screen-paused" hidden>
      <div class="paused">
        <p class="paused__title">PAUSED</p>
        <!-- 기기 입력 방식에 맞는 문구를 main.js가 채운다 -->
        <p class="paused__hint" id="paused-hint"></p>
      </div>
    </div>

    <!-- 가로 모드 안내 오버레이 (PRD 2장) — 상태 머신과 독립적으로 최상단 표시 -->
    <div class="game__overlay game__overlay--rotate" id="screen-rotate" hidden>
      <div class="rotate">
        <div class="rotate__phone"></div>
        <p class="rotate__title">세로로 돌려주세요</p>
        <p class="rotate__desc">이 게임은 세로 화면 전용입니다</p>
      </div>
    </div>

    <!-- 조이스틱 가이드 — 페이지 로드당 첫 게임 시작 시 1회, 우하단 반투명 힌트 (PRD 4.1) -->
    <div class="game__guide" id="joystick-guide" hidden>
      <div class="game__guide-ring"><div class="game__guide-knob"></div></div>
      <p class="game__guide-text">아무 곳이나 터치해서 조작</p>
    </div>

    <!-- PC 와이드 좌우 여백 사이드 광고 (dodge-side) — 여백 폭이 충분할 때만 ads.js가 표시·ins 동적 생성 -->
    <div class="game__side-ad game__side-ad--left" id="side-ad-left" hidden></div>
    <div class="game__side-ad game__side-ad--right" id="side-ad-right" hidden></div>
  </div>

  <!-- 게임 진입점 스크립트 (ES 모듈) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
